name: Deploy preview

# Publishes the site to the project Pages URL —
#   https://lynkrobotics.github.io/website/
# — so a change can be reviewed in a real browser without touching the live
# site at www.lynkrobotics.org.
#
# Run it by hand: Actions -> Deploy preview -> Run workflow.
#
# Two things make this a preview rather than the live site:
#   * it builds with PATH_PREFIX=/website/, so links work under the
#     /website/ sub-path that project Pages sites are served from;
#   * it drops the CNAME file, so the deploy does not claim the custom domain.
#
# The repository's Pages "Custom domain" box must be EMPTY while previewing,
# otherwise GitHub redirects the project URL to the live site. Put
# www.lynkrobotics.org back in the box afterwards and run "Deploy to GitHub
# Pages"; whichever workflow ran last is what Pages serves.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PATH_PREFIX: /website/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node scripts/check-links.mjs

      - name: Drop CNAME and discourage indexing
        run: |
          rm -f _site/CNAME
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
